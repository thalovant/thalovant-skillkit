permissions:
  contents: read

name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Scratch servers for test/test_records.py's live runs: the suite empties them.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: records
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      THALOVANT_RECORDS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      THALOVANT_RECORDS_TEST_DATABASE_URL: postgresql://postgres:pw@127.0.0.1:5432/records
    strategy:
      fail-fast: false
      matrix:
        # The oldest a skill may run on, what the node runs, and the newest.
        python: ["3.11", "3.12", "3.14"]
    name: test (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job reads the checkout and then runs code installed from
          # PyPI; it never pushes. Leaving GITHUB_TOKEN in the workspace's
          # git config would hand that code a credential it has no use for.
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      # The base install includes ovos-workshop, so base-class tests run
      # instead of silently skipping their framework dependency.
      - run: python -m pip install -e . pytest ruff fakeredis lupa redis 'psycopg[binary]'
      - run: ruff check thalovant_skillkit test scripts
      - run: pytest -q
  installed_package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The kit's floor and its generated consumers' is 3.11 (0.30.0).
        python: ["3.11", "3.14"]
    name: Installed wheel (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      # The default build makes the wheel from the just-built source archive.
      - run: python -m build
      - name: Exercise the installed CLI and generated consumer wheels
        run: >-
          python scripts/check-installed-package.py
          --wheel dist/*.whl --sdist dist/*.tar.gz --work-dir "${{ runner.temp }}"
  test_ovos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    name: OVOS integration (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      # The optional stack must be present here: the ordinary matrix also
      # verifies that importing SkillKit does not require OVOScope.
      - run: python -m pip install --pre -e '.[testing]'
      - run: python -m pip check
      - run: python -m pytest -q test/test_testing_ovos.py --timeout=120 --timeout-method=thread
        env:
          COVERAGE_FILE: ${{ runner.temp }}/skillkit-ovos-coverage

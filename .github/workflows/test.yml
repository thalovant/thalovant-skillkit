permissions:
  contents: read

name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest a skill may run on, what the node runs, and the newest.
        python: ["3.10", "3.12", "3.14"]
    name: test (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job reads the checkout and then runs code installed from
          # PyPI; it never pushes. Leaving GITHUB_TOKEN in the workspace's
          # git config would hand that code a credential it has no use for.
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      # The 'skill' extra, so the base-class tests run rather than skip:
      # a suite that quietly skips the half needing ovos-workshop is not a gate.
      - run: python -m pip install -e . pytest ruff
      - run: ruff check thalovant_skillkit test
      - run: pytest -q
  test_ovos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    name: OVOS integration (py${{ matrix.python }})
    env:
      COVERAGE_FILE: ${{ runner.temp }}/skillkit-ovos-coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      # The optional stack must be present here: the ordinary matrix also
      # verifies that importing SkillKit does not require OVOScope.
      - run: python -m pip install --pre -e '.[testing]'
      - run: python -m pip check
      - run: python -m pytest -q test/test_testing_ovos.py --timeout=120 --timeout-method=thread

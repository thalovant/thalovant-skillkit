name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job reads the checkout and then runs code installed from
          # PyPI; it never pushes. Leaving GITHUB_TOKEN in the workspace's
          # git config would hand that code a credential it has no use for.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      # Catches a broken README or malformed metadata before it reaches an
      # index that will not let the version be replaced.
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so
      # there is no API token to store, leak or rotate. Configure the publisher
      # once at https://pypi.org/manage/project/thalovant-skillkit/settings/publishing/
      id-token: write
      # A job-level permissions block replaces the defaults rather than adding
      # to them; without these the artifact download can be refused.
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

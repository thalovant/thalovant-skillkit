[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thalovant-skillkit"
version = "0.4.3"
description = "Write a Thalovant OVOS skill without writing the plumbing"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thalovant" }]
keywords = ["ovos", "hivemind", "thalovant", "skill", "voice assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "requests>=2.31",
    "ovos-utils>=0.8.5",
    # tomllib arrived in 3.11; tomli is the same parser for the one version before.
    "tomli>=2.0; python_version < '3.11'",
]

# thalovant_skillkit.skill needs the skill framework; the rest of the library
# does not, so a caller that only wants the codec or the message helpers is not
# made to install it.
[project.optional-dependencies]
skill = ["ovos-workshop>=8.0.0"]

[project.scripts]
thalovant-skillkit = "thalovant_skillkit.cli:main"

[project.urls]
Homepage = "https://github.com/thalovant/thalovant-skillkit"
Documentation = "https://docs.thalovant.com/developers/writing-a-skill"
Source = "https://github.com/thalovant/thalovant-skillkit"
Issues = "https://github.com/thalovant/thalovant-skillkit/issues"

[tool.setuptools.packages.find]
include = ["thalovant_skillkit*"]

# The locale tree is data the library reads at runtime, so it has to be in
# the wheel -- the runtime installs from a baked wheelhouse, not from a
# checkout.
[tool.setuptools.package-data]
thalovant_skillkit = ["locale/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Correctness and import hygiene. Not S/TRY/RUF: they flag the vendored
# knowledge client's deliberate fail-closed ValueError, and the typographic
# apostrophe in text.py that exists precisely to be normalised away.
select = ["E", "F", "I", "UP", "B"]

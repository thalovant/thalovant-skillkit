[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thalovant-skillkit"
version = "0.1.1"
description = "Shared plumbing for the Thalovant OVOS skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31",
    "ovos-utils>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/thalovant/thalovant-skillkit"

[tool.setuptools.packages.find]
include = ["thalovant_skillkit*"]

[tool.pytest.ini_options]
testpaths = ["test"]

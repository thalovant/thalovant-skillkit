plural:
  one: n % 10 = 1 and n % 100 != 11,71,91
  two: n % 10 = 2 and n % 100 != 12,72,92
  few: n % 10 = 3..4,9 and n % 100 != 10..19,70..79,90..99
  many: n != 0 and n % 1000000 = 0

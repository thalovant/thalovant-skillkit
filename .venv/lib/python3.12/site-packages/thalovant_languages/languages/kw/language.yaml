# kw (kw). Generated by scripts/derive.py -- do not edit; edit overrides/kw.yaml and rerun.
# Sources: CLDR 48 plural rules.
# Thresholds: a word counts once it appears in two treebanks (when the language has three);
# a continuation word is closed-class 80% of the time and
# the last word of a sentence at most 4% of the time, seen 20+ times;
# a trailing word is a continuation word that is neither a possessive nor an auxiliary;
# a question opener is interrogative (PronType=Int, 20+ times) or starts a
# question 60% of the time it starts a sentence (40% for an auxiliary);
# a question word anywhere is interrogative and sits in a question 85% of the time;
# a written form is capitalised mid-sentence 90% of the time.
plural:
  zero: n = 0
  one: n = 1
  two: n % 100 = 2,22,42,62,82 or n % 1000 = 0 and n % 100000 = 1000..20000,40000,60000,80000 or n !=
    0 and n % 1000000 = 100000
  few: n % 100 = 3,23,43,63,83
  many: n != 1 and n % 100 = 1,21,41,61,81
